server {
    listen 80;
    server_name localhost;
    root /var/www/public;
    index index.php index.html;

    # Must exceed PHP post_max_size (55M) so large Arsip uploads are not
    # rejected by Nginx with 413 before reaching PHP-FPM.
    client_max_body_size 60M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # Unduh sertifikat batch: 25 PDF Dompdf ≈ 50 detik per request.
        # Default 60 dtk terlalu mepet dan memutus request di tengah proses.
        fastcgi_read_timeout 180s;
        fastcgi_send_timeout 180s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
