; Upload limits for Arsip Digital (ARSIP_MAX_UPLOAD_KB=51200 → 50 MB per file).
; PHP defaults (upload_max_filesize=2M, post_max_size=8M) silently reject
; anything bigger before Filament even sees it, so these must stay >= the
; configured max_upload_kb plus multipart overhead.
upload_max_filesize = 50M
post_max_size = 55M
memory_limit = 256M
max_execution_time = 300
max_input_time = 300
